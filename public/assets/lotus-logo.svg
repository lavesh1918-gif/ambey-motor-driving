<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="140" fill="#ffffff" stroke="#111827" stroke-width="7" />
  
  <!-- Stylized Lotus L Emblem -->
  <g fill="#111827" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    <!-- L stem and petal curve -->
    <path d="M 108 62 C 108 62 128 66 132 100 L 132 132 C 132 142 142 146 156 148 C 166 150 176 154 180 156 C 160 154 136 148 124 140 C 112 132 108 116 108 94 Z" fill="#111827" stroke="none" />
    
    <!-- Central upright lotus petal -->
    <path d="M 144 114 C 140 84 158 64 168 92 C 172 106 160 120 144 114 Z" fill="none" stroke="#111827" stroke-width="5" />
    
    <!-- Right top petal -->
    <path d="M 154 118 C 168 98 196 90 192 114 C 188 128 166 130 154 118 Z" fill="none" stroke="#111827" stroke-width="5" />
    
    <!-- Right bottom petal -->
    <path d="M 152 132 C 172 122 198 128 190 148 C 180 158 160 148 152 132 Z" fill="none" stroke="#111827" stroke-width="5" />
  </g>
  
  <!-- Typography: LOTUS -->
  <text x="150" y="208" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="38" letter-spacing="3" fill="#111827">
    LOTUS
  </text>
  
  <!-- Typography: WEB STUDIO -->
  <text x="150" y="238" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="15" letter-spacing="4" fill="#111827">
    WEB STUDIO
  </text>
</svg>
